version: "3.9"

# Oracle Cloud Always Free (ARM A1) deployment stack.
# api    -> Spring Boot backend (built from local Dockerfile)
# postgres -> Postgres matching the version dumped from Railway (assumption: 15,
#             confirm with `SELECT version();` on Railway before first migration)
# caddy  -> automatic HTTPS reverse proxy for api.prerithgroups.in
#
# Assumption: no other service needs to reach Postgres from outside the host,
# so it has no published port; only the docker network exposes 5432.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ambikarealestate-backend:latest
    container_name: ambika-api
    restart: always
    env_file:
      - .env
    environment:
      PORT: 8080
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-AmbikaEstate}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: ambika-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-AmbikaEstate}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # No "ports:" mapping on purpose: Postgres is reachable only from
    # containers on the internal network, never from the host's public IP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DB:-AmbikaEstate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: ambika-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
