# Test profile configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (H2 schema managed by Hibernate)
spring.flyway.enabled=false

# Security
app.security.jwt.secret-key=testSecretKeyForUnitTestingPurposesOnly1234567890
app.security.jwt.expiration-time=86400000

# Logging
logging.level.com.realestate=WARN
logging.level.org.springframework.security=WARN
