# ===================================================================
# REAL ESTATE APPLICATION CONFIGURATION
# ===================================================================

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${PORT:8080}
# server.servlet.context-path is not set because controllers already use /api prefix
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024


# ===================================================================
# DATASOURCE CONFIGURATION
# ===================================================================
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/AmbikaEstate}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# ===================================================================
# JPA/HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# ===================================================================
# SECURITY CONFIGURATION
# ===================================================================
# JWT Configuration
app.security.jwt.secret-key=${JWT_SECRET:mySecretKey}
app.security.jwt.expiration-time=86400000
app.security.jwt.refresh-expiration-time=604800000

# CORS Configuration
app.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:3001,https://ambikarealestate.com,https://www.ambikarealestate.com}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.security.cors.allowed-headers=*
app.security.cors.allow-credentials=true

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.config=classpath:log4j2.xml
logging.level.com.realestate=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# HikariCP Connection Pool Logging
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# ===================================================================
# ACTUATOR CONFIGURATION
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true

# ===================================================================
# APPLICATION SPECIFIC CONFIGURATION
# ===================================================================
# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Property Images Configuration
app.property.images.upload-dir=${UPLOAD_DIR:./uploads/property-images}
app.property.images.max-files=10
app.property.images.allowed-extensions=jpg,jpeg,png,webp

# Email Configuration (for inquiries)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp Integration (Twilio)
app.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:your-account-sid}
app.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:your-auth-token}
app.whatsapp.from-number=${TWILIO_FROM_NUMBER:whatsapp:+1234567890}

# Google Maps API
app.maps.api-key=${GOOGLE_MAPS_API_KEY:your-google-maps-api-key}

# YouTube Integration
app.youtube.api-key=${YOUTUBE_API_KEY:your-youtube-api-key}

# ===================================================================
# CACHE CONFIGURATION
# ===================================================================
spring.cache.type=simple
spring.cache.cache-names=properties,users,inquiries

# ===================================================================
# FLYWAY CONFIGURATION
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===================================================================
# VALIDATION CONFIGURATION
# ===================================================================
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===================================================================
# LOCAL DEVELOPMENT NOTES
# ===================================================================
# These settings are helpful during development regardless of whether you
# run the default H2 datasource or the postgres profile.
#
# H2 default:
#   Start normally with no active profile.
#
# PostgreSQL:
#   Start with profile 'postgres' and provide POSTGRES_URL,
#   POSTGRES_USERNAME, and POSTGRES_PASSWORD if the defaults do not match.
#
# Enable SQL logging in development (commented out for production)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# Enable debug logging for development (commented out for production)
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.security=DEBUG
# logging.level.org.hibernate.SQL=DEBUG

# Disable security for development (if needed)
# app.security.enabled=false