# ===================================================================
# LOCAL DEVELOPMENT PROFILE - H2 IN-MEMORY DATABASE
# ===================================================================

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080

# ===================================================================
# DATASOURCE CONFIGURATION - H2 IN-MEMORY
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA/HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# ===================================================================
# H2 CONSOLE (for debugging)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# SECURITY CONFIGURATION
# ===================================================================
# JWT Configuration
app.security.jwt.secret-key=local-development-secret-key-that-is-long-enough-1234567890
app.security.jwt.expiration-time=86400000
app.security.jwt.refresh-expiration-time=604800000

# CORS Configuration - Allow all local development URLs
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:3001

# ===================================================================
# API CONFIGURATION
# ===================================================================
API_URL=http://localhost:8080

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.com.realestate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
